<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEX-MD | THE LAST KEY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ffcc; /* Neon Teal */
            --primary-dark: #008f72;
            --bg-dark: #070b14;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(0, 255, 204, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Prevent text selection */
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, hsla(173, 100%, 50%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(173, 100%, 50%, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated background particles */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: -1;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
            100% { transform: translateY(0px) scale(1); }
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 255, 204, 0.05);
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo-icon {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--primary);
            animation: keyPulse 2s infinite;
        }

        @keyframes keyPulse {
            0% { text-shadow: 0 0 10px var(--primary); }
            50% { text-shadow: 0 0 30px var(--primary), 0 0 50px var(--primary); }
            100% { text-shadow: 0 0 10px var(--primary); }
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--primary);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 18px 20px 18px 50px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 18px;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
            font-weight: 500;
            letter-spacing: 1px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        button {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 18px;
            font-weight: 800;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 25px var(--primary);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* PAIRING CODE BOX */
        #pair-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #code-display {
            font-size: 32px;
            font-weight: 800;
            font-family: monospace;
            letter-spacing: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 12px;
            color: var(--primary);
            border: 1px dashed var(--primary);
            margin: 20px 0;
            text-shadow: 0 0 10px var(--primary);
        }

        .instructions {
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 20px;
            line-height: 1.6;
            border-left: 3px solid var(--primary);
        }

        .instructions b { 
            color: var(--text-main); 
            font-size: 14px;
        }

        /* SUCCESS STATUS */
        #status-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(0, 255, 204, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            animation: successPulse 2s infinite;
        }

        @keyframes successPulse {
            0% { box-shadow: 0 0 0px rgba(0, 255, 204, 0.2); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.5); }
            100% { box-shadow: 0 0 0px rgba(0, 255, 204, 0.2); }
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .footer {
            font-size: 11px; 
            color: #475569; 
            margin-top: 30px;
            letter-spacing: 1px;
            font-weight: 600;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="bg-glow"></div>

    <div class="container">
        <i class="fas fa-key logo-icon"></i>
        <h1>LEX-MD</h1>
        <div class="subtitle">The Last Key</div>

        <div id="input-area">
            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="number" id="phoneNum" placeholder="255 712 345 678">
            </div>
            <button id="submitBtn">Generate Code</button>
        </div>

        <!-- PAIRING CODE DISPLAY -->
        <div id="pair-container">
            <p style="color: var(--text-muted); font-size: 13px;">Your 8-digit code:</p>
            <div id="code-display">--------</div>

            <div class="instructions">
                <b><i class="fab fa-whatsapp"></i> HOW TO PAIR:</b><br><br>
                1. Open WhatsApp on your phone.<br>
                2. Go to <b>Settings</b> > <b>Linked Devices</b>.<br>
                3. Tap <b>Link with Phone Number</b>.<br>
                4. Enter the code shown above.
            </div>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 20px; font-weight: bold;" class="loading-dots">Waiting for connection</p>
        </div>

        <!-- SUCCESS MESSAGE -->
        <div id="status-container">
            <i class="fas fa-check-circle" style="font-size: 30px; margin-bottom: 10px;"></i> <br>
            <b style="letter-spacing: 1px;">CONNECTED SUCCESSFULLY!</b> <br>
            <span id="connected-num" style="font-size: 14px; opacity: 0.8;"></span> <br>
            <small style="display: block; margin-top: 10px;">LEX-MD is now active.</small>
        </div>

        <div class="footer">
            DEVELOPED BY CHARLES_10 &copy; 2026
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const phoneInput = document.getElementById('phoneNum');
        const pairContainer = document.getElementById('pair-container');
        const inputArea = document.getElementById('input-area');
        const codeDisplay = document.getElementById('code-display');
        const statusContainer = document.getElementById('status-container');
        const connectedNum = document.getElementById('connected-num');

        submitBtn.onclick = async () => {
            const num = phoneInput.value;
            if (!num || num.length < 10) {
                alert("Please enter a valid number with country code!");
                return;
            }

            submitBtn.innerHTML = "GENERATING...";
            submitBtn.disabled = true;

            try {
                // FIXED: Changed /pair to /api/pair to match your index.js backend
                const response = await fetch(`/api/pair?num=${num}`);
                const data = await response.json();

                if (data.code) {
                    inputArea.style.display = "none";
                    pairContainer.style.display = "block";
                    codeDisplay.innerText = data.code;
                } else {
                    alert("Error: " + (data.error || "Server Busy"));
                    submitBtn.innerText = "Generate Code";
                    submitBtn.disabled = false;
                }
            } catch (err) {
                alert("Failed to connect to server. Make sure the bot is running.");
                submitBtn.innerText = "Generate Code";
                submitBtn.disabled = false;
            }
        };

        // Real-time status checker (Checks if the bot connected)
        setInterval(async () => {
            if (pairContainer.style.display === "block") {
                try {
                    const res = await fetch('/api/status');
                    const data = await res.json();
                    if (data.connected) {
                        pairContainer.style.display = "none";
                        statusContainer.style.display = "block";
                        connectedNum.innerText = phoneInput.value;
                    }
                } catch (e) {
                    // Ignore network errors during polling
                }
            }
        }, 3000); // Check every 3 seconds

        // Basic anti-inspect protection
        document.onkeydown = function(e) {
            if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 86 || e.keyCode === 85 || e.keyCode === 73 || e.keyCode === 74)) {
                return false;
            }
        };
    </script>
</body>
</html>
